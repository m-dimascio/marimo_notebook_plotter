[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mosfet_sim"
version = "0.1.0"
description = "Interactive MOSFET device simulation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "marimo>=0.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mosfet_sim"]
